services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: [{ path: .env, required: false }]
    volumes:
      - ./sample_data:/app/sample_data
      - ./backend/data:/app/backend/data
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on: [backend]
